<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Application</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>

<div class="quiz-container">
    <h1>Simple Quiz App</h1>

    <div id="quiz">
        <h2 id="question">Question Text</h2>

        <ul>
           <li><button class="option" onclick="checkAnswer(1)"></button></li>
           <li><button class="option" onclick="checkAnswer(2)"></button></li>
           <li><button class="option" onclick="checkAnswer(3)"></button></li>
           <li><button class="option" onclick="checkAnswer(4)"></button></li>
        </ul>

        <button id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>

    <h2 id="result"></h2>
</div>

<script src="quiz.js"></script>
</body>
</html>
